spring:
  datasource:
    url: jdbc:h2:mem:closing-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

kakao:
  client-id: test-kakao-client-id
  client-secret: test-kakao-client-secret
  token-uri: http://localhost:9999/oauth/token
  user-info-uri: http://localhost:9999/user/me
  redirect-uri: http://localhost:3000/oauth/kakao

jwt:
  secret: test-jwt-secret-key-must-be-at-least-32-bytes-long

storage:
  s3:
    bucket: test-bucket
    region: ap-northeast-2

ai:
  server:
    base-url: http://localhost:9999
    timeout-seconds: 1

nts:
  service-key: test-nts-service-key

support:
  sync:
    enabled: false
